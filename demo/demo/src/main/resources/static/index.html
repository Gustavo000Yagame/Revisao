<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja da Teste - Aula lorenzo</title>
    <style>

        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #bed9f4, #97dfec);
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .container{
            background:white;
            padding:50px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            max-width:500px;
        }
        h1{
            color:#333;
            margin-bottom:15px;
        }
        p{
            color:#555;
            margin-bottom:30px;
        }
        a{
            text-decoration:none;
            background: #5bfe4f;
            color: #121212;
            padding:12px 25px;
            border-radius:8px;
            font-weight:bold;
            transition:0.3s;
        }
        a:hover{
            background:#2b8be6;
            transform:scale(1.05);
        }

    </style>
</head>
<body>
<div class="container">
    <h1>🛒 Loja da Teste Professor Lorenzo</h1>
    <p>
        Esse é o nosso site para testar conceitos e funcionalidades do Spring Web.
    </p>
    <a href="/produtos">Ver Produtos</a>
</div>
</body>
</html>
